server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  application:
    name: nobel-adam-twin-api
  config:
    import: optional:file:.env[.properties]
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    async:
      request-timeout: 90000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

twin:
  knowledge-dir: ${TWIN_KNOWLEDGE_DIR:./knowledge}

  ai:
    base-url: ${TWIN_AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${ALI_API_KEY:}
    chat:
      model: ${TWIN_CHAT_MODEL:deepseek-v4.1-flash}
      temperature: ${TWIN_CHAT_TEMPERATURE:0.3}
      max-tokens: ${TWIN_CHAT_MAX_TOKENS:700}
      enable-thinking: ${TWIN_CHAT_ENABLE_THINKING:false}
    embedding:
      model: ${TWIN_EMBEDDING_MODEL:qwen3.7-text-embedding-flash}
      dimensions: ${TWIN_EMBEDDING_DIMENSIONS:1024}
      batch-size: ${TWIN_EMBEDDING_BATCH_SIZE:10}
    rerank:
      enabled: ${TWIN_RERANK_ENABLED:true}
      base-url: ${TWIN_RERANK_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
      model: ${TWIN_RERANK_MODEL:qwen3.7-text-rerank}
      max-docs: ${TWIN_RERANK_MAX_DOCS:10}
      top-n: ${TWIN_RERANK_TOP_N:6}
      only-when-ambiguous: ${TWIN_RERANK_ONLY_WHEN_AMBIGUOUS:true}
      ambiguity-gap: ${TWIN_RERANK_AMBIGUITY_GAP:0.06}

  retrieval:
    top-k: ${TWIN_TOP_K:6}
    candidate-k: ${TWIN_CANDIDATE_K:12}
    max-per-project: ${TWIN_MAX_PER_PROJECT:3}
    similarity-threshold: ${TWIN_SIMILARITY_THRESHOLD:0.35}
    rerank-threshold: ${TWIN_RERANK_THRESHOLD:0.20}
    max-context-chars: ${TWIN_MAX_CONTEXT_CHARS:6500}
    max-chunk-chars: ${TWIN_MAX_CHUNK_CHARS:850}
    max-history-messages: ${TWIN_MAX_HISTORY_MESSAGES:6}
    max-question-chars: ${TWIN_MAX_QUESTION_CHARS:500}

  rate-limit:
    per-minute: ${TWIN_RATE_LIMIT_PER_MINUTE:10}
    per-day-per-ip: ${TWIN_RATE_LIMIT_PER_DAY_PER_IP:100}
    global-per-day: ${TWIN_RATE_LIMIT_GLOBAL_PER_DAY:500}

  idempotency:
    ttl: ${TWIN_IDEMPOTENCY_TTL:10m}

  cors:
    allowed-origins: ${TWIN_CORS_ALLOWED_ORIGINS:https://home.nobeladam.cn}
